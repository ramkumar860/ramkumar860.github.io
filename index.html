<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learn Trading - Telegram Channel</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #0a1628 0%, #1a2a3a 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background: linear-gradient(135deg, #0f1e2e 0%, #1a2a3a 100%);
            border-radius: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
            padding: 40px 25px;
            text-align: center;
            border: 1px solid rgba(102, 178, 255, 0.2);
        }

        .logo-container {
            margin-bottom: 30px;
        }

        .logo {
            width: 160px;
            height: 160px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 20px;
        }

        .logo img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .channel-title {
            font-size: 32px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 15px;
            letter-spacing: 1px;
        }

        .channel-description {
            font-size: 18px;
            font-weight: 500;
            color: #66b2ff;
            margin-bottom: 30px;
            line-height: 1.4;
        }

        .telegram-description {
            font-size: 15px;
            color: #aaa;
            margin-bottom: 35px;
            font-weight: 400;
        }

        .button-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 25px;
        }

        .btn {
            padding: 14px 30px;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            width: 100%;
        }

        .btn-telegram {
            background: linear-gradient(135deg, #0088cc 0%, #0077b6 100%);
            color: white;
            box-shadow: 0 8px 20px rgba(0, 136, 204, 0.3);
        }

        .btn-telegram:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(0, 136, 204, 0.4);
        }

        .btn-ads {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.3);
        }

        .btn-ads:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(102, 126, 234, 0.4);
        }

        .btn-icon {
            font-size: 18px;
        }

        .ads-label {
            font-size: 12px;
            color: #999;
            margin-top: 15px;
            font-weight: 500;
        }

        @media (max-width: 480px) {
            .container {
                padding: 30px 20px;
                border-radius: 25px;
            }

            .channel-title {
                font-size: 28px;
            }

            .channel-description {
                font-size: 16px;
            }

            .btn {
                padding: 12px 25px;
                font-size: 15px;
            }
        }

        .footer-credit {
            margin-top: 25px;
            font-size: 11px;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Logo -->
        <div class="logo-container">
            <div class="logo">
                <svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
                    <!-- Candlestick Chart -->
                    <!-- Candle 1 -->
                    <rect x="50" y="140" width="25" height="80" fill="#ffffff"/>
                    <rect x="57.5" y="100" width="10" height="40" fill="#ffffff"/>
                    <rect x="57.5" y="220" width="10" height="40" fill="#ffffff"/>
                    
                    <!-- Candle 2 -->
                    <rect x="95" y="100" width="25" height="120" fill="#00a8ff"/>
                    <rect x="102.5" y="80" width="10" height="20" fill="#00a8ff"/>
                    <rect x="102.5" y="220" width="10" height="30" fill="#00a8ff"/>
                    
                    <!-- Candle 3 -->
                    <rect x="140" y="80" width="25" height="160" fill="#ffffff"/>
                    <rect x="147.5" y="60" width="10" height="20" fill="#ffffff"/>
                    <rect x="147.5" y="240" width="10" height="20" fill="#ffffff"/>
                    
                    <!-- Candle 4 -->
                    <rect x="185" y="60" width="25" height="180" fill="#00a8ff"/>
                    <rect x="192.5" y="40" width="10" height="20" fill="#00a8ff"/>
                    <rect x="192.5" y="240" width="10" height="20" fill="#00a8ff"/>
                    
                    <!-- Uptrend Line -->
                    <line x1="75" y1="200" x2="210" y2="80" stroke="#00d4ff" stroke-width="4" stroke-linecap="round"/>
                    
                    <!-- Arrow -->
                    <polygon points="210,80 220,70 215,85" fill="#00d4ff"/>
                    
                    <!-- Home icon -->
                    <g transform="translate(280, 150)">
                        <polygon points="0,-20 -20,10 -15,10 -15,30 15,30 15,10 20,10" fill="#00a8ff"/>
                        <line x1="-5" y1="10" x2="-5" y2="30" stroke="#0a1628" stroke-width="2"/>
                        <line x1="5" y1="10" x2="5" y2="30" stroke="#0a1628" stroke-width="2"/>
                    </g>
                </svg>
            </div>
        </div>

        <!-- Channel Title -->
        <h1 class="channel-title">LEARN TRADING</h1>

        <!-- Description -->
        <p class="channel-description">
            Smart Trading Education
        </p>

        <!-- Telegram Description -->
        <p class="telegram-description">
            Join our community for professional trading education and insights
        </p>

        <!-- Buttons -->
        <div class="button-group">
            <a href="https://t.me/+mYWvvqWPZ5ljZjJl" target="_blank" class="btn btn-telegram">
                <span class="btn-icon">✓</span>
                Join on Telegram
            </a>
            <a href="https://t.me/+OgGdgIxBgydiZjc1" target="_blank" class="btn btn-ads">
                <span class="btn-icon">📢</span>
                Ads Setup by Adslink
            </a>
        </div>

        <p class="ads-label">For Advertising & Partnership</p>

        <!-- Footer -->
        <div class="footer-credit">
            Professional Trading Education Channel
        </div>
    </div>

</body>
</html>
